[www]
user = www
group = www

listen = 9000
listen.owner = www
listen.group = www
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; pcntl se compila en la imagen porque los workers de cola lo necesitan para
; atender SIGTERM, pero PHP-FPM no tiene ningun motivo para controlar procesos.
; Se desactiva aqui, en el pool web, para no ampliar la superficie del servidor
; HTTP con una capacidad que solo usan los procesos de consola.
php_admin_value[disable_functions] = pcntl_alarm,pcntl_exec,pcntl_fork,pcntl_signal,pcntl_signal_dispatch,pcntl_sigprocmask,pcntl_sigtimedwait,pcntl_sigwaitinfo,pcntl_wait,pcntl_waitpid,pcntl_wexitstatus,pcntl_wifexited,pcntl_wifsignaled,pcntl_wifstopped,pcntl_wstopsig,pcntl_wtermsig
