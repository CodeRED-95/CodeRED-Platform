# PostgreSQL 16 Configuration for CodeRED Platform (RUC v3.0)
# Optimized for 18M+ records with 2.4GB table + 3.4GB indices
# See docs-ruc/PERFORMANCE.md "PHASE 2: PostgreSQL Infrastructure"

# ============================================================================
# CONNECTIVITY
# ============================================================================
# listen_addresses: interfaces donde PostgreSQL acepta conexiones TCP.
#
# DEBE ser '*' (no 'localhost'). Dentro de Docker, cada contenedor tiene su
# propia IP en la red bridge del proyecto; con 'localhost' PostgreSQL solo
# escucha en 127.0.0.1 DENTRO de su propio contenedor y los demás servicios
# (app, queue, scheduler y sobre todo codered-n8n) no pueden conectarse:
# n8n responde 503 "Database is not ready!" y Laravel "Connection refused".
#
# Esto NO expone PostgreSQL a Internet: el servicio `postgres` en
# docker-compose.yml NO publica el puerto 5432 hacia el host (no tiene
# bloque `ports:`), solo `expose` implícito dentro de la red del compose.
# Si algún día se agrega `ports:`, publíquelo SIEMPRE como
# "127.0.0.1:5432:5432", nunca como "5432:5432".
listen_addresses = '*'

# ============================================================================
# MEMORY CONFIGURATION
# ============================================================================
# shared_buffers: 25% of RAM (1GB for 4GB host)
# Caches hot data pages. Rule: 25% of total system RAM.
shared_buffers = 1GB

# effective_cache_size: 75% of RAM (3GB for 4GB host)
# Tells planner how much memory is available for caching.
# Rule: 75% of total system RAM (includes shared_buffers + OS cache).
effective_cache_size = 3GB

# work_mem: Per-operation memory for sorts/hashes
# Rule: (RAM - shared_buffers) / (2 * max_connections)
# = (4GB - 1GB) / (2 * 100) = ~15MB; we use 32MB for safety
work_mem = 32MB

# maintenance_work_mem: Memory for VACUUM, ANALYZE, CREATE INDEX
# Rule: 10% of RAM; minimum 256MB
maintenance_work_mem = 512MB

# ============================================================================
# QUERY PLANNER CONFIGURATION
# ============================================================================
# random_page_cost: Cost of random I/O vs sequential I/O
# SSD (default 1.0): random I/O is almost as fast as sequential
# HDD (default 4.0): random I/O is ~4x slower
# Docker on modern hardware: use 1.1 (slight random I/O penalty, but not 4x)
random_page_cost = 1.1

# effective_io_concurrency: Parallel I/O operations
# Rule: number of disk spindles; for SSD, can be high (8+)
# Docker on single logical volume: 4-8 is typical
effective_io_concurrency = 4

# ============================================================================
# PARALLEL QUERY EXECUTION
# ============================================================================
# max_parallel_workers_per_gather: Max workers per query (ANALYZE, large scans)
# Rule: N-1 cores; Docker container has 4 vCPU → 3 workers
max_parallel_workers_per_gather = 3

# max_parallel_workers: Total parallel workers across all queries
# Rule: N cores (same as max_parallel_workers_per_gather or higher)
max_parallel_workers = 4

# max_worker_processes: Backend worker processes
# Rule: N cores; Docker container has 4 vCPU → 4
max_worker_processes = 4

# ============================================================================
# STATISTICS & AUTOVACUUM
# ============================================================================
# default_statistics_target: Column statistics resolution
# Rule: 100 (default) for most; increase to 500-1000 for very large tables
# We use 500 for ruc_records table (critical path)
default_statistics_target = 500

# autovacuum: Enable automatic VACUUM and ANALYZE
# MUST be ON for large tables to prevent bloat and keep statistics fresh
autovacuum = on

# autovacuum_max_workers: Parallel VACUUM workers
# Rule: 2-3 for large systems; we use 2
autovacuum_max_workers = 2

# ============================================================================
# LOGGING (for diagnostics; disable in production)
# ============================================================================
log_statement = 'all'
log_duration = on
log_min_duration_statement = 1000  # Log queries taking >1s (in ms)

# ============================================================================
# PERFORMANCE TUNING - STATEMENT TIMEOUT
# ============================================================================
# statement_timeout: Maximum query execution time (0 = disabled)
# Set to 300s (5 minutes) for runaway queries
statement_timeout = 300s

# ============================================================================
# CHECKPOINT & RECOVERY
# ============================================================================
# checkpoint_timeout: Frequency of checkpoints
# Rule: 15-30 minutes for large DBs
checkpoint_timeout = 30min

# wal_buffers: Write-ahead log buffer
# Rule: 16MB for most systems (default is 2MB)
wal_buffers = 16MB

# ============================================================================
# FINAL NOTES
# ============================================================================
# After restarting PostgreSQL with this config:
#   1. Run: docker compose restart postgres
#   2. Wait for healthcheck to pass
#   3. Run: docker compose exec -T postgres psql -U codered -d codered -c "ANALYZE;"
#   4. Monitor: SELECT now(), query_start, pid FROM pg_stat_activity;
#
# For ruc_records table specifically (after restore or large import):
#   1. docker compose exec -T postgres psql -U codered -d codered
#   2. ANALYZE ruc_records; (takes ~5-10s for 18M rows)
#   3. \d ruc_records (verify indices)
#   4. SELECT n_live_tup, n_dead_tup FROM pg_stat_user_tables WHERE relname = 'ruc_records';
