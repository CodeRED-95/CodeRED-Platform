services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: codered-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: codered-nginx
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: codered-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      N8N_DB_DATABASE: ${N8N_DB_DATABASE:-n8n}
      N8N_DB_USERNAME: ${N8N_DB_USERNAME:-n8n}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codered-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: codered-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "redis", "--queue=agency-imports,ruc-imports,default", "--sleep=2", "--tries=1", "--timeout=86400", "--max-time=172800", "--memory=768"]
    stop_grace_period: 2h
    volumes:
      - ./:/var/www/html
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: codered-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["sh", "-lc", "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    volumes:
      - ./:/var/www/html
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  shalom-extractor:
    build:
      context: ./shalom-extractor
    container_name: codered-shalom-extractor
    restart: unless-stopped
    environment:
      PORT: 3000
      SHALOM_EXTRACTOR_MAX_FILE_MB: ${SHALOM_EXTRACTOR_MAX_FILE_MB:-10}
      SHALOM_PAGE_TIMEOUT_MS: ${SHALOM_PAGE_TIMEOUT_MS:-120000}
      SHALOM_EXTRACTOR_DEBUG: ${SHALOM_EXTRACTOR_DEBUG:-false}
      SHALOM_EXTRACTOR_LOG_SAMPLE_SIZE: ${SHALOM_EXTRACTOR_LOG_SAMPLE_SIZE:-3}
      SHALOM_EXTRACTOR_LOG_FULL_RECORDS: ${SHALOM_EXTRACTOR_LOG_FULL_RECORDS:-false}
    volumes:
      - ./storage/logs/shalom-extractor:/app/logs/shalom
    expose:
      - "3000"
    networks:
      - default
    security_opt:
      - no-new-privileges:true

  codered-agent:
    build:
      context: .
      dockerfile: packages/codered-agent/Dockerfile
    container_name: codered-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CODERED_PLATFORM_URL: ${APP_URL}
      CODERED_AGENT_PUBLIC_URL: ${CODERED_AGENT_PUBLIC_URL}
      CODERED_AGENT_DATA_PATH: ${CODERED_AGENT_DATA_PATH:-/data}
    volumes:
      - codered-agent-data:/data
    ports:
      - "127.0.0.1:5680:5680"
    networks:
      - default
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5680/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  codered-n8n:
    build:
      context: .
      dockerfile: docker/n8n/Dockerfile
    image: codered-n8n:2.31.4
    pull_policy: never
    container_name: codered-n8n
    restart: unless-stopped
    env_file:
      - .env
    command: ["sh", "-lc", "mkdir -p /home/node/.n8n/custom && rm -rf /home/node/.n8n/custom/n8n-nodes-codered && cp -a /opt/n8n-nodes-codered /home/node/.n8n/custom/n8n-nodes-codered && n8n"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_DATABASE:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USERNAME:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_HOST: ${N8N_HOST:-n8n.codered.host}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-https://n8n.codered.host/}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-https://n8n.codered.host/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_CUSTOM_EXTENSIONS: /home/node/.n8n/custom
      N8N_VERSION: ${N8N_VERSION:-2.31.4}
      CODERED_AGENT_LOCAL_URL: ${CODERED_AGENT_LOCAL_URL:-http://codered-agent:5680}
      CODERED_AGENT_LOCAL_API_TOKEN: ${CODERED_AGENT_LOCAL_API_TOKEN}
      CODERED_API_BASE_URL: ${APP_URL}
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - codered_n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      codered-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  redisdata:
  codered-agent-data:
  codered_n8n_data:
