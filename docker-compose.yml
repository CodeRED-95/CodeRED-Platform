services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: codered-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      # Credencial de Firebase, montada de solo lectura desde fuera del
      # repositorio. Nunca entra en la imagen ni se versiona: ver
      # docs/FIREBASE_SETUP.md.
      - ${FIREBASE_CREDENTIALS_HOST:-/home/codered/secrets/firebase-adminsdk.json}:/var/www/secrets/firebase-adminsdk.json:ro
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # `php-fpm -t` confirma que la configuración de FPM sigue válida y
      # `php artisan about` verifica que Laravel arranca sin depender de
      # tráfico externo, sesiones ni servicios remotos.
      test: [ "CMD-SHELL", "php-fpm -t >/dev/null 2>&1 && php artisan about --no-interaction >/dev/null 2>&1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    container_name: codered-nginx
    restart: unless-stopped
    ports:
      - "8090:80"
      # Declaración Jurada Shalom (app/servicio Node aparte, ver el servicio
      # "declaracion-jurada" más abajo): puerto propio para no mezclar su
      # SPA con las rutas de Laravel en el puerto 8090.
      - "8091:8081"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
      declaracion-jurada:
        condition: service_healthy
    healthcheck:
      # Consulta local, estática y servida directamente por Nginx.
      # No depende de Laravel/PHP-FPM, Cloudflare ni de tráfico externo.
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: codered-postgres
    restart: unless-stopped
    # /dev/shm (shared memory) es usado por VACUUM FULL y ANALYZE con
    # parallel workers. Con 64MB default, operaciones grandes fallan con
    # "No space left on device". Para 18M+ registros, mínimo 512MB.
    # Host tiene ~4GB RAM, así que 512MB es seguro (~13% RAM).
    # Ver docs-ruc/PERFORMANCE.md "PHASE 2: PostgreSQL Infrastructure".
    shm_size: 512mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_DB_DATABASE: ${N8N_DB_DATABASE:-n8n}
      N8N_DB_USERNAME: ${N8N_DB_USERNAME:-n8n}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/codered.conf:/etc/postgresql/codered.conf:ro
    command: [ "postgres", "-c", "config_file=/etc/postgresql/codered.conf" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: codered-redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes", "--save", "60", "1" ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: codered-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: [ "php", "artisan", "queue:work", "redis", "--queue=agency-imports,default", "--sleep=2", "--tries=1", "--timeout=86400", "--max-time=172800", "--memory=768" ]
    stop_grace_period: 2h
    volumes:
      - ./:/var/www/html
      # Credencial de Firebase, montada de solo lectura desde fuera del
      # repositorio. Nunca entra en la imagen ni se versiona: ver
      # docs/FIREBASE_SETUP.md.
      - ${FIREBASE_CREDENTIALS_HOST:-/home/codered/secrets/firebase-adminsdk.json}:/var/www/secrets/firebase-adminsdk.json:ro
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Worker DEDICADO para RestoreRucBackupJob (cola/conexión "ruc-backups",
  # ver config/queue.php). Separado del worker "queue" a propósito: un
  # restore de ruc_records puede tardar decenas de minutos u horas y NO
  # debe bloquear emails/tokens/imports/agency jobs del worker general, ni
  # verse bloqueado por ellos. stop_grace_period cubre el timeout máximo
  # del job (86400s) para que `docker compose stop`/recreación de imagen
  # nunca SIGKILL-ee un restore a mitad de camino — aunque el flujo normal
  # ya evita llegar a ese punto (ver update.sh, paso "Verificando que no
  # haya un restore RUC activo").
  queue-ruc-backups:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: codered-queue-ruc-backups
    restart: unless-stopped
    working_dir: /var/www/html
    command: [ "php", "artisan", "queue:work", "ruc-backups", "--queue=ruc-backups", "--sleep=2", "--tries=1", "--timeout=86400", "--max-time=172800", "--memory=768" ]
    stop_grace_period: 25h
    volumes:
      - ./:/var/www/html
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: codered-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: [ "sh", "-lc", "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done" ]
    volumes:
      - ./:/var/www/html
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  shalom-extractor:
    build:
      context: ./shalom-extractor
    container_name: codered-shalom-extractor
    restart: unless-stopped
    environment:
      PORT: 3000
      SHALOM_EXTRACTOR_MAX_FILE_MB: ${SHALOM_EXTRACTOR_MAX_FILE_MB:-10}
      SHALOM_PAGE_TIMEOUT_MS: ${SHALOM_PAGE_TIMEOUT_MS:-120000}
      SHALOM_EXTRACTOR_DEBUG: ${SHALOM_EXTRACTOR_DEBUG:-false}
      SHALOM_EXTRACTOR_LOG_SAMPLE_SIZE: ${SHALOM_EXTRACTOR_LOG_SAMPLE_SIZE:-3}
      SHALOM_EXTRACTOR_LOG_FULL_RECORDS: ${SHALOM_EXTRACTOR_LOG_FULL_RECORDS:-false}
    volumes:
      - ./storage/logs/shalom-extractor:/app/logs/shalom
    expose:
      - "3000"
    networks:
      - default
    security_opt:
      - no-new-privileges:true

  codered-agent:
    build:
      context: .
      dockerfile: packages/codered-agent/Dockerfile
    container_name: codered-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CODERED_PLATFORM_URL: ${APP_URL}
      CODERED_AGENT_PUBLIC_URL: ${CODERED_AGENT_PUBLIC_URL}
      CODERED_AGENT_DATA_PATH: ${CODERED_AGENT_DATA_PATH:-/data}
    volumes:
      - codered-agent-data:/data
    ports:
      - "127.0.0.1:5680:5680"
    networks:
      - default
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:5680/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3

  # Declaración Jurada Shalom: aplicación Node/React independiente
  # (packages/shalom-declaracion-jurada) que vive en el mismo docker-compose
  # de CodeRED Platform en vez de un proyecto Docker aparte. Se conecta de
  # forma read-only a la misma base PostgreSQL para reconocer cuentas de
  # CodeRED Platform (ver server/app-backend.js, lookupCoderedUser) y usa un
  # token Sanctum (ability dni:consultar) para resolver DNIs a través de la
  # API de CodeRED en vez de duplicar la integración con el proveedor.
  declaracion-jurada:
    build:
      context: ./packages/shalom-declaracion-jurada
    container_name: codered-declaracion-jurada
    restart: unless-stopped
    environment:
      PORT: 3000
      # Cifra la clave del proveedor DNI y credenciales de Telegram/correo
      # guardadas en el panel (config propia de Declaración Jurada, no
      # identidad de usuario). Ya no existe un admin local propio: el
      # acceso y el rol administrador se resuelven contra CodeRED Platform
      # (declaracion-jurada.view / declaracion-jurada.manage).
      APP_ENCRYPTION_KEY: ${DECLARACION_JURADA_ENCRYPTION_KEY:-}
      DATABASE_PATH: /app/.data/declaracion-jurada.db
      COOKIE_SECURE: ${DECLARACION_JURADA_COOKIE_SECURE:-true}
      DNI_API_URL: ${DECLARACION_JURADA_DNI_API_URL:-https://api.perudevs.com/api/v1/dni/simple}
      # Interconectividad con CodeRED Platform (ver docker/nginx/default.conf
      # y CLAUDE.md para el resto de la infraestructura compartida). Usa el
      # nombre del servicio "nginx" en la red interna de Docker, NO
      # ${APP_URL} (público): resolver ese dominio saldría por el Cloudflare
      # Tunnel y volvería a entrar por el mismo túnel, duplicando latencia
      # y arriesgando timeouts — comprobado en producción con un 499/502.
      CODERED_API_URL: http://nginx
      CODERED_API_TOKEN: ${DECLARACION_JURADA_CODERED_API_TOKEN:-}
      # URL pública (para el navegador, a diferencia de CODERED_API_URL que
      # es interna a Docker): usada solo para el enlace "Administra tu
      # cuenta en CodeRED Platform" del frontend.
      CODERED_PUBLIC_URL: ${APP_URL}
      CODERED_DB_HOST: ${DB_HOST:-postgres}
      CODERED_DB_PORT: ${DB_PORT:-5432}
      CODERED_DB_DATABASE: ${DB_DATABASE}
      # Rol de solo lectura dedicado (creado por la migración
      # 2026_08_13_000001_create_declaracion_jurada_readonly_role), NO las
      # credenciales completas de la app: solo puede hacer SELECT sobre
      # users/roles/permissions/role_user/permission_role.
      CODERED_DB_USERNAME: declaracion_jurada_ro
      CODERED_DB_PASSWORD: ${DECLARACION_JURADA_DB_PASSWORD}
    volumes:
      - declaracion-jurada-data:/app/.data
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  codered-n8n:
    build:
      context: .
      dockerfile: docker/n8n/Dockerfile
    image: codered-n8n:2.31.4
    pull_policy: never
    container_name: codered-n8n
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_DATABASE:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USERNAME:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # Dominio productivo: codered.lat (migrado desde codered.host).
      # Estos son SOLO defaults de arranque; el valor real viene del .env.
      N8N_HOST: ${N8N_HOST:-n8n.codered.lat}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-https://n8n.codered.lat/}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-https://n8n.codered.lat/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_CUSTOM_EXTENSIONS: /opt/n8n-nodes-codered
      N8N_VERSION: ${N8N_VERSION:-2.31.4}
      CODERED_AGENT_LOCAL_URL: ${CODERED_AGENT_LOCAL_URL:-http://codered-agent:5680}
      CODERED_AGENT_LOCAL_API_TOKEN: ${CODERED_AGENT_LOCAL_API_TOKEN}
      CODERED_API_BASE_URL: ${APP_URL}
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      CODERED_N8N_WEBHOOK_SECRET: ${N8N_TOKEN_REQUEST_WEBHOOK_SECRET}
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - codered_n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      codered-agent:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  redisdata:
  codered-agent-data:
  codered_n8n_data:
  declaracion-jurada-data:
