<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=360, initial-scale=1.0" />
    <title>Buscador Shalom</title>
    <script type="module" src="./popup.ts"></script>
  </head>
  <body>
    <main class="popup" aria-labelledby="popup-title">
      <header class="popup-header">
        <img class="popup-logo" src="/icons/icon-48.png" alt="CodeRED" />
        <div class="popup-header__content">
          <div class="popup-title-row">
            <h1 id="popup-title">Buscador Shalom</h1>
            <span id="extension-version" class="version">v-</span>
          </div>
          <div class="popup-status-line">
            <span id="status-dot" class="status-dot" data-tone="loading" aria-hidden="true"></span>
            <span id="token-state">Cargando estado...</span>
          </div>
        </div>
        <button id="open-options" class="icon-button" type="button" aria-label="Abrir configuración" title="Abrir configuración">
          <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
            <path d="M12 8.4a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 0 0 0-7.2Zm8.2 3.6c0-.5-.1-1-.2-1.4l2-1.5-2-3.4-2.4 1a8.4 8.4 0 0 0-2.4-1.4L14.8 2h-5.6l-.4 2.8c-.9.3-1.7.8-2.4 1.4l-2.4-1-2 3.4 2 1.5c-.1.5-.2 1-.2 1.5s.1 1 .2 1.5l-2 1.5 2 3.4 2.4-1c.7.6 1.5 1.1 2.4 1.4l.4 2.6h5.6l.4-2.6c.9-.3 1.7-.8 2.4-1.4l2.4 1 2-3.4-2-1.5c.1-.6.2-1.1.2-1.6Z" />
          </svg>
        </button>
      </header>

      <section class="popup-card" aria-label="Estado de conexión" aria-live="polite" aria-atomic="true">
        <p id="description" class="description">Cargando estado...</p>
        <p id="token-preview" class="token-preview" hidden></p>

        <dl class="status-list">
          <div class="status-row">
            <dt>Última sincronización</dt>
            <dd id="last-sync">Sin sincronizar</dd>
          </div>
          <div class="status-row">
            <dt>Agencias disponibles</dt>
            <dd id="agency-count">0</dd>
          </div>
          <div class="status-row">
            <dt>Estado</dt>
            <dd id="connection-state" class="tone" data-tone="missing">Desconectado</dd>
          </div>
        </dl>

        <div class="actions" aria-label="Acciones disponibles">
          <button id="primary-action" class="button button--primary" type="button">Solicitar token</button>
          <button id="configure-token" class="button button--secondary" type="button">Configurar token</button>
          <button id="request-another-token" class="button button--link" type="button" hidden>Solicitar otro token</button>
        </div>

        <p id="message" class="message" role="status" aria-live="polite"></p>
      </section>

      <footer class="popup-footer">
        <span>Sincronización automática</span>
        <strong id="sync-mode" data-tone="muted">Pausada</strong>
      </footer>
    </main>
  </body>
</html>
