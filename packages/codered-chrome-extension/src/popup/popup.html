<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buscador Shalom</title>
    <script type="module" src="./popup.ts"></script>
  </head>
  <body>
    <main class="popup-shell">
      <header class="topbar">
        <img src="/icons/icon-48.png" alt="CodeRED" />
        <div class="title-block"><h1>Buscador Shalom</h1><span id="summary">Cargando</span></div>
        <button id="options" class="icon-button" title="Configuración" aria-label="Abrir configuración">⚙</button>
      </header>
      <section class="status-card">
        <p class="eyebrow">Estado de conexión</p>
        <div class="connection-line"><span id="status-dot" class="dot"></span><strong id="token-state">Verificando...</strong></div>
        <p id="token-help" class="help">Revisando configuración local.</p>
        <dl class="metrics">
          <div><dt>Token</dt><dd id="token-masked">-</dd></div>
          <div><dt>Última sincronización</dt><dd id="updated">-</dd></div>
          <div><dt>Agencias disponibles</dt><dd id="agency-count">0</dd></div>
          <div><dt>Versión local</dt><dd id="catalog-version">-</dd></div>
        </dl>
        <div class="actions">
          <button id="primary-action" class="primary" type="button">Solicitar token</button>
          <button id="configure-token" type="button">Configurar token</button>
          <button id="request-token" class="link-action" type="button">Solicitar otro token</button>
        </div>
        <p id="message" role="status"></p>
      </section>
    </main>
  </body>
</html>
