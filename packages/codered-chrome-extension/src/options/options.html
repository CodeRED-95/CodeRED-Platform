<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buscador Shalom Control</title>
    <script type="module" src="./options.ts"></script>
  </head>
  <body>
    <main class="shell">
      <header>
        <img src="/icons/icon-48.png" alt="CodeRED" />
        <div>
          <h1>Buscador Shalom Control</h1>
          <p id="connection">Cargando configuración</p>
        </div>
      </header>
      <section>
        <label for="token">Token de CodeRED Platform<input id="token" type="password" autocomplete="off" placeholder="Pega el token" /></label>
        <p id="masked"></p>
        <div class="actions">
          <button id="save" type="button">Guardar token</button>
          <button id="test" type="button">Probar conexión</button>
          <button id="sync" type="button">Sincronizar ahora</button>
          <button id="delete" type="button" class="danger">Eliminar token</button>
        </div>
        <p class="request-link">¿No tienes token? <button id="request" type="button">Solicitar uno</button></p>
      </section>
      <section class="stats">
        <p>Última sincronización: <strong id="lastSync">-</strong></p>
        <p>Versión local: <strong id="version">-</strong></p>
        <p>Agencias almacenadas: <strong id="count">0</strong></p>
        <p>Estado: <strong id="state">-</strong></p>
      </section>
      <p id="message" role="status"></p>
    </main>
  </body>
</html>
