<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 360px;
            margin: 0;
            padding: 16px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(180deg, #111827 0%, #0f172a 100%);
            color: #e5e7eb;
        }
        h3 { margin: 0; font-size: 18px; }
        .muted { color: #9ca3af; font-size: 12px; }
        .card {
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 14px;
            padding: 14px;
            margin-top: 12px;
        }
        input, button {
            width: 100%;
            box-sizing: border-box;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.1);
            padding: 10px 12px;
            font: inherit;
        }
        input {
            margin-top: 8px;
            background: rgba(15,23,42,.9);
            color: #fff;
        }
        button {
            margin-top: 10px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            font-weight: 700;
        }
        button.secondary { background: rgba(255,255,255,.08); }
        button.danger { background: #b91c1c; }
        button:disabled { opacity: .6; cursor: not-allowed; }
        .row { display: flex; gap: 8px; }
        .row > * { flex: 1; }
        #status { font-size: 12px; min-height: 16px; margin-top: 8px; }
        .hidden { display: none; }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 12px;
            border: 1px solid rgba(255,255,255,.08);
            background: rgba(255,255,255,.05);
        }
    </style>
</head>
<body>
    <h3>Shalom Recordar</h3>
    <p class="muted">Inicia sesión con tu cuenta de CodeRED Platform. No se guarda tu contraseña.</p>

    <div id="loginView" class="card">
        <label class="muted">Correo electrónico</label>
        <input id="email" type="email" autocomplete="username" placeholder="usuario@codered.lat">
        <label class="muted">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••••••">
        <button id="btnLogin">Iniciar sesión</button>
        <a href="https://platform.codered.lat/register" target="_blank" rel="noreferrer" class="muted" style="display:block;margin-top:10px;">Crear cuenta en CodeRED Platform</a>
    </div>

    <div id="sessionView" class="card hidden">
        <div id="userPill" class="pill">Sesión activa</div>
        <p id="userName" style="margin:10px 0 4px;font-weight:700;"></p>
        <p id="userEmail" class="muted" style="margin:0;"></p>
        <p id="lastSync" class="muted" style="margin:10px 0 0;"></p>
        <div class="row">
            <button id="btnSync">Sincronizar ahora</button>
            <button id="btnRefresh" class="secondary">Refrescar</button>
        </div>
        <button id="btnLogout" class="danger">Cerrar sesión</button>
    </div>

    <p id="status"></p>
    <script src="sync.js"></script>
    <script src="popup.js"></script>
</body>
</html>
