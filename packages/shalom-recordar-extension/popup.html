<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --brand: #2563eb;
            --border: rgba(255,255,255,.1);
            --surface: rgba(255,255,255,.04);
            --muted: #9ca3af;
        }
        body {
            width: 340px;
            margin: 0;
            padding: 12px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            font-size: 13px;
            background: linear-gradient(180deg, #111827 0%, #0f172a 100%);
            color: #e5e7eb;
        }
        h3 { margin: 0; font-size: 15px; }
        .muted { color: var(--muted); font-size: 11px; }
        .card {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 12px;
            padding: 10px;
            margin-top: 10px;
        }
        label.muted { display: block; margin-bottom: 2px; }
        input {
            width: 100%;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid var(--border);
            padding: 7px 10px;
            margin-top: 6px;
            font: inherit;
            background: rgba(15,23,42,.9);
            color: #fff;
        }
        /* Botones compactos: menos alto y menos padding que la versión previa. */
        button {
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid transparent;
            padding: 7px 10px;
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            background: var(--brand);
            color: #fff;
        }
        button.block { width: 100%; margin-top: 8px; }
        button.secondary { background: rgba(255,255,255,.08); }
        button:disabled { opacity: .6; cursor: not-allowed; }
        .row { display: flex; gap: 6px; margin-top: 8px; }
        .row > button { flex: 1; margin: 0; }
        #status { font-size: 11px; min-height: 14px; margin-top: 8px; }
        .hidden { display: none; }
        .pill {
            display: inline-flex; align-items: center; gap: 6px;
            border-radius: 999px; padding: 3px 9px; font-size: 11px;
            border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.05);
        }
        .dot { width: 7px; height: 7px; border-radius: 999px; background: #22c55e; display: inline-block; }
        .dot.warn { background: #f59e0b; }

        .header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .avatar-wrap { position: relative; }
        .avatar {
            width: 30px; height: 30px; min-width: 30px;
            padding: 0; border-radius: 999px; background: var(--brand);
            color: #fff; font-weight: 700; font-size: 13px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,.14);
        }
        .avatar:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
        .menu {
            position: absolute; top: 38px; right: 0; z-index: 20;
            width: 220px; padding: 6px;
            border-radius: 10px; background: #0b1220;
            border: 1px solid rgba(255,255,255,.12);
            box-shadow: 0 12px 28px rgba(0,0,0,.45);
        }
        .menu-head { padding: 6px 8px 8px; border-bottom: 1px solid rgba(255,255,255,.08); }
        .menu-name { font-weight: 700; font-size: 12px; word-break: break-word; }
        .menu-mail { color: var(--muted); font-size: 10px; word-break: break-all; }
        .menu-state { margin-top: 5px; font-size: 10px; color: #86efac; display: flex; align-items: center; gap: 6px; }
        .menu button {
            width: 100%; margin: 3px 0 0; padding: 7px 9px; text-align: left;
            background: transparent; border-radius: 7px; font-weight: 600; font-size: 12px; color: #e5e7eb;
        }
        .menu button:hover, .menu button:focus-visible { background: rgba(255,255,255,.07); outline: none; }
        .menu button.danger-item { color: #fca5a5; }
        .menu button.danger-item:hover { background: rgba(185,28,28,.18); }

        .stat { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; margin-top: 5px; }
        .stat span:last-child { color: #e5e7eb; font-weight: 600; }

        /* Lista de los últimos registros: altura acotada con scroll interno. */
        .records { margin-top: 10px; }
        .records-head { display: flex; align-items: center; justify-content: space-between; }
        .records-list {
            margin-top: 6px; max-height: 168px; overflow-y: auto;
            border: 1px solid rgba(255,255,255,.07); border-radius: 8px;
            background: rgba(15,23,42,.5);
        }
        .records-list::-webkit-scrollbar { width: 8px; }
        .records-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 8px; }
        .rec {
            display: grid; grid-template-columns: 1fr auto; gap: 2px 8px;
            padding: 6px 9px; border-bottom: 1px solid rgba(255,255,255,.05);
        }
        .rec:last-child { border-bottom: 0; }
        .rec-field { font-weight: 600; font-size: 12px; color: #fff; word-break: break-word; }
        .rec-time { color: var(--muted); font-size: 10px; white-space: nowrap; }
        .rec-value {
            grid-column: 1 / -1; color: #cbd5e1; font-size: 11px;
            word-break: break-word; font-family: ui-monospace, monospace;
        }
        .records-empty { padding: 14px; text-align: center; color: var(--muted); font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <h3>Shalom Recordar</h3>
        <div class="avatar-wrap">
            <button id="btnAvatar" class="avatar hidden" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Menú de cuenta">?</button>
            <div id="accountMenu" class="menu hidden" role="menu" aria-labelledby="btnAvatar">
                <div class="menu-head">
                    <div id="menuName" class="menu-name"></div>
                    <div id="menuEmail" class="menu-mail"></div>
                    <div class="menu-state"><span class="dot"></span><span id="menuState">Conectado</span></div>
                </div>
                <button id="menuSync" type="button" role="menuitem">Sincronizar ahora</button>
                <button id="menuAccount" type="button" role="menuitem">Mi cuenta en CodeRED Platform</button>
                <button id="menuLogout" type="button" role="menuitem" class="danger-item">Cerrar sesión</button>
            </div>
        </div>
    </div>
    <p id="tagline" class="muted" style="margin:6px 0 0;">Inicia sesión con tu cuenta de CodeRED Platform. No se guarda tu contraseña.</p>

    <!-- Estado inicial mientras se valida la sesión guardada: evita el parpadeo
         del formulario de login para quien ya tiene sesión. -->
    <div id="loadingView" class="card">
        <p class="muted" style="margin:0;">Cargando sesión...</p>
    </div>

    <div id="loginView" class="card hidden">
        <label class="muted" for="email">Correo electrónico</label>
        <input id="email" type="email" autocomplete="username" placeholder="usuario@codered.lat">
        <label class="muted" for="password" style="margin-top:8px;">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••••••">
        <button id="btnLogin" class="block">Iniciar sesión</button>
        <a href="https://platform.codered.lat/register" target="_blank" rel="noreferrer" class="muted" style="display:block;margin-top:8px;">Crear cuenta en CodeRED Platform</a>
    </div>

    <div id="sessionView" class="card hidden">
        <p id="userName" style="margin:0 0 2px;font-weight:700;font-size:13px;"></p>
        <p id="userEmail" class="muted" style="margin:0;"></p>
        <div id="userPill" class="pill" style="margin-top:8px;"><span id="connDot" class="dot"></span><span id="connText">Conectado</span></div>

        <div style="margin-top:8px;">
            <div class="stat"><span class="muted">Última sincronización</span><span id="lastSync">—</span></div>
            <div class="stat"><span class="muted">Última sincronización automática</span><span id="lastAutomaticSync">—</span></div>
            <div class="stat"><span class="muted">Próxima sincronización</span><span id="nextAutomaticSync">—</span></div>
            <div class="stat"><span class="muted">Registros locales</span><span id="recordCount">—</span></div>
        </div>

        <div class="row">
            <button id="btnSync">Sincronizar</button>
            <button id="btnRefresh" class="secondary">Refrescar</button>
            <button id="btnExport" class="secondary">Exportar</button>
        </div>

        <div class="records">
            <div class="records-head">
                <span class="muted">Últimos registros</span>
                <span id="recordsMeta" class="muted"></span>
            </div>
            <div id="recordsList" class="records-list" role="list" aria-label="Últimos registros guardados"></div>
        </div>
    </div>

    <p id="status"></p>
    <script src="db.js"></script>
    <script src="sync.js"></script>
    <script src="popup.js"></script>
</body>
</html>
